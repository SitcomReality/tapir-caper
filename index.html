<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tapir Caper</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "cannon-es": "https://esm.sh/cannon-es@0.20.0",
                "nipplejs": "https://esm.sh/nipplejs@0.10.1"
            }
        }
    </script>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Splash Screen -->
        <div id="splash-screen" class="screen">
            <img src="splash_screen.png" alt="Tapir Caper" class="title-img">
            <h1>TAPIR CAPER</h1>
            <button id="start-btn" class="btn">Start Heist</button>
            <div class="instructions">
                <p>Desktop: WASD to Move, SPACE to Grab/Drop</p>
                <p>Mobile: Joystick to Move, Tap Right to Grab/Drop</p>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="screen hidden">
            <div class="score-container">
                <img src="tapir_face.png" class="hud-icon">
                <span id="score-display">Loot: $0</span>
            </div>
            <div id="message-display">Steal the Loot!</div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h2>BUSTED!</h2>
            <p id="final-stats"></p>
            <button id="restart-btn" class="btn">Try Again</button>
        </div>
    </div>

    <!-- Joystick Zone for Mobile -->
    <div id="joystick-zone"></div>
    <div id="mobile-action-btn">GRAB</div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
